# Nền tảng web Zalo Chat Assistant — MỘT lệnh cho cả máy chủ:  docker compose up -d
#
#   mongo  ── cơ sở dữ liệu (không mở cổng ra ngoài)
#   api    ── Express + Mongoose, cổng 4789 (chỉ loopback: BIND_IP)
#   web    ── React SPA + nginx trong ảnh, proxy /api, /downloads, /uploads sang api (chỉ loopback)
#   edge   ── Caddy: nhận 80/443, tự xin và gia hạn chứng chỉ Let's Encrypt, điều hướng
#             DOMAIN → web (chặn /admin), ADMIN_DOMAIN → web (/ → /admin). CHỈ chạy khi .env có COMPOSE_PROFILES=server.
#
# Máy dev (Mac): cp .env.example .env → docker compose up -d      → mongo + api + web (edge không chạy).
# Máy chủ thật:  cp .env.production.example .env, điền JWT_SECRET/DOMAIN/ACME_EMAIL, giữ COMPOSE_PROFILES=server
#                → docker compose up -d                            → thêm edge, HTTPS tự động. Chi tiết: DEPLOY.md.
#
# ⚠️ `docker compose up -d` KHÔNG tự dựng lại ảnh khi mã đổi: sau khi rsync mã mới chạy `docker compose up -d --build`.

services:
  mongo:
    image: mongo:7
    container_name: zca-mongo
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "1"]
    volumes:
      - zca-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Không mở cổng ra ngoài: chỉ api trong mạng nội bộ mới cần nói chuyện với Mongo.

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: zca-platform-api:latest
    container_name: zca-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # BIND_IP mặc định 127.0.0.1: chỉ máy này thấy (Docker vượt qua ufw nếu gắn 0.0.0.0). Cần máy khác trong LAN
    # gọi thẳng api để thử nghiệm thì đặt BIND_IP=0.0.0.0 trong .env.
    ports:
      - "${BIND_IP:-127.0.0.1}:${API_PORT:-4789}:4789"
    environment:
      PORT: 4789
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/zca}
      JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET trong .env (chuỗi ngẫu nhiên dài)}
      ACCESS_TTL_SEC: ${ACCESS_TTL_SEC:-900}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      RESET_TTL_MIN: ${RESET_TTL_MIN:-30}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4790}
      RELEASES_DIR: /data/releases
      UPLOADS_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4790,http://localhost:5174}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_NAME: ${APP_NAME:-Zalo Chat Assistant}
    volumes:
      - zca-data:/data
    # HEALTHCHECK khai trong api/Dockerfile (wget /health) — web chờ api khoẻ rồi mới lên.

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: zca-platform-web:latest
    container_name: zca-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-4790}:80"
    # HEALTHCHECK khai trong web/Dockerfile.

  # Cổng vào HTTPS cho máy chủ thật. Caddy tự xin chứng chỉ Let's Encrypt cho DOMAIN, www.DOMAIN, ADMIN_DOMAIN
  # ngay lần đầu chạy (cần DNS đã trỏ về máy và cổng 80/443 mở), tự gia hạn, lưu ở volume caddy-data.
  edge:
    image: caddy:2-alpine
    container_name: zca-edge
    restart: unless-stopped
    profiles: ["server"]
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Mặc định localhost để máy dev không cần khai; máy chủ thật đặt DOMAIN/ADMIN_DOMAIN trong .env.
      DOMAIN: ${DOMAIN:-localhost}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.${DOMAIN:-localhost}}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  zca-mongo:
  zca-data:
  caddy-data:
  caddy-config:
