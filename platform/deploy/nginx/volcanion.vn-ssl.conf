# ── nginx MÁY CHỦ — bước 2: HTTPS cho volcanion.vn (trang chính + API + tải bản cài) và admin.volcanion.vn ──
# Chỉ bật SAU khi đã có chứng chỉ ở /etc/letsencrypt/live/volcanion.vn/ (một chứng chỉ cho cả 3 tên).
# Cả hai tên miền cùng trỏ về container web (127.0.0.1:4790); nginx trong container đó proxy /api, /downloads,
# /uploads sang api. Không cần tên miền riêng cho API hay cập nhật: ứng dụng desktop dùng
# https://volcanion.vn/api/… và tải bản cài ở https://volcanion.vn/downloads/….

upstream zca_web {
    server 127.0.0.1:4790;
    keepalive 16;
}
upstream zca_admin {
    server 127.0.0.1:4792;
    keepalive 16;
}

# Trang chính: volcanion.vn (www → không www)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name volcanion.vn www.volcanion.vn;

    ssl_certificate     /etc/letsencrypt/live/volcanion.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/volcanion.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;      # certbot tạo sẵn; thiếu thì: certbot cài lại hoặc bỏ dòng
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.volcanion.vn) {
        return 301 https://volcanion.vn$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    proxy_hide_header Strict-Transport-Security;   # API (helmet) cũng gửi HSTS — tránh hai header trùng

    # Khu quản trị chỉ phục vụ ở admin.volcanion.vn.
    location ^~ /admin      { return 404; }
    location ^~ /api/admin/ { return 404; }

    # Trang chính không nhận tệp tải lên lớn (tải bản cài đi qua admin.volcanion.vn).
    client_max_body_size 10m;

    # Bản cài .dmg/.exe: stream thẳng, không đệm ra đĩa.
    location /downloads/ {
        proxy_pass         http://zca_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass         http://zca_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# Quản trị: ỨNG DỤNG RIÊNG (container admin, 127.0.0.1:4792); nhận tệp cài tới 600 MB.server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.volcanion.vn;

    ssl_certificate     /etc/letsencrypt/live/volcanion.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/volcanion.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header Strict-Transport-Security;

    # Admin tải bản cài .dmg/.exe lên (tới ~130 MB, giới hạn hợp đồng 600 MB) — đẩy thẳng, chờ đủ lâu.
    client_max_body_size    600m;
    client_body_timeout     600s;
    proxy_request_buffering off;
    proxy_read_timeout      600s;
    proxy_send_timeout      600s;

    # Không đăng ký ở tên miền quản trị: chỉ đăng nhập + quên mật khẩu.
    location = /dang-ky            { return 302 /dang-nhap; }
    location = /api/auth/register  { return 404; }

    location / {
        proxy_pass         http://zca_admin;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
