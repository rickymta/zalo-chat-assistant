# ── nginx MÁY CHỦ (không phải nginx trong container web) — bước 1: chỉ HTTP ────────────────────────
# Chép vào /etc/nginx/sites-available/volcanion.vn và bật (ln -s … sites-enabled/). Dùng khối này để
# certbot xin chứng chỉ theo webroot; sau khi có chứng chỉ thì bật thêm volcanion.vn-ssl.conf.
# Máy chủ chỉ mở 80/443; api (127.0.0.1:4789) và web (127.0.0.1:4790) không lộ ra ngoài.

server {
    listen 80;
    listen [::]:80;
    server_name volcanion.vn www.volcanion.vn admin.volcanion.vn;

    # Let's Encrypt kiểm chứng tên miền qua đây (certbot --webroot -w /var/www/certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
