# nginx cho web tĩnh (React SPA) + proxy sang api trong cùng mạng Docker.

# Nhận diện bot xem trước liên kết (Zalo/Telegram/Lark/Facebook/Slack…). Khối `map` phải nằm ở
# mức http — conf.d/*.conf được include TRONG http nên đặt ngoài server{} ở đây là hợp lệ.
map $http_user_agent $wa_prerender_bot {
    default 0;
    "~*(facebookexternalhit|Facebot|Twitterbot|Slackbot|TelegramBot|Zalo|Lark|Feishu|Discordbot|WhatsApp|LinkedInBot|Pinterest|SkypeUriPreview|redditbot|Applebot|Googlebot|bingbot|vkShare)" 1;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    # Bản cài .dmg/.exe đi qua đây khi admin tải lên (giới hạn hợp đồng là 600 MB).
    client_max_body_size 600m;
    # Tải tệp lớn có thể lâu — đừng cắt giữa chừng.
    client_body_timeout  600s;
    proxy_read_timeout   600s;
    proxy_send_timeout   600s;

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # DNS nội bộ của Docker + upstream đặt trong BIẾN: nginx chỉ phân giải tên "api" lúc có
    # request, thay vì lúc khởi động. Không làm vậy thì api chưa lên là nginx chết luôn với
    # "host not found in upstream" và web không phục vụ nổi cả trang tĩnh.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:4789;
        proxy_pass         $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # đẩy thẳng tệp lớn sang api, không đệm ra đĩa trước
    }

    location /downloads/ {
        set $api_upstream http://api:4789;
        proxy_pass         $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;         # stream file cài về thẳng cho trình duyệt
    }

    location /uploads/ {
        set $api_upstream http://api:4789;
        proxy_pass         $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # mime.types của nginx (kể cả 1.27) KHÔNG khai đuôi .mjs ⇒ rơi về
    # application/octet-stream, trình duyệt từ chối nạp module script và báo lỗi giống hệt 404.
    # Phải chữa bằng khối location riêng — TUYỆT ĐỐI không dùng directive `types { ... }` ở
    # mức server vì nó ghi đè cả bảng MIME kế thừa (mất luôn MIME của css/ảnh/font).
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header   Cache-Control "public, max-age=31536000, immutable";
        try_files    $uri =404;
    }

    # Asset có băm nội dung trong tên ⇒ cache dài.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    # SPA: mọi đường dẫn không phải tệp thật đều trả index.html cho react-router xử lý.
    # Riêng bot xem-trước-link (không chạy JS) được đẩy sang API để lấy thẻ OG theo route.
    # Mẫu "return 418 → named location" tránh các bẫy của `if ... proxy_pass` chung với try_files;
    # người dùng thật ($wa_prerender_bot = 0) đi thẳng try_files như cũ, không đổi gì.
    location / {
        add_header Cache-Control "no-cache";
        error_page 418 = @prerender;
        if ($wa_prerender_bot) {
            return 418;
        }
        try_files  $uri $uri/ /index.html;
    }

    location @prerender {
        set $api_upstream http://api:4789;
        proxy_pass         $api_upstream/__prerender$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # API kẹt/không lên thì bot nhận SPA tĩnh (vẫn có thẻ OG mặc định) thay vì lỗi.
        proxy_connect_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;
    }
}
